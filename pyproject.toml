[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olx-market-monitor"
version = "0.1.0"
description = "Локальный Telegram-монитор объявлений OLX.kz"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "python-telegram-bot>=22,<23",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[project.scripts]
olx-monitor = "olx_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
